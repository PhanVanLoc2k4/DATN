# Ultralytics BoTSORT tracker configuration - Optimized for Fight Tracking
tracker_type: botsort      # tracker type, ['botsort', 'bytetrack']
track_high_thresh: 0.5    # threshold for the first association
track_low_thresh: 0.1     # threshold for the second association
new_track_thresh: 0.6     # threshold for init new track if the 1st association fail
track_buffer: 150         # Tăng lên 150 để giữ ID lâu hơn khi bị che khuất
match_thresh: 0.8         # Tăng lên 0.8 để dễ dàng chấp nhận khớp ID cũ
gmc_method: sparseOptFlow # Global Motion Compensation method
proximity_thresh: 0.5     # threshold for proximity matching
appearance_thresh: 0.3    # Tăng nhẹ ReID threshold để bám sát hơn
with_reid: False          # Tắt ReID để tránh lỗi 'numpy.ndarray' object has no attribute 'cpu' trên CPU và tăng tốc độ xử lý
model: auto               
fuse_score: True          
iou_thresh: 0.2           # Giảm threshold IOU để cho phép sai lệch nhẹ khi bám đuổi
